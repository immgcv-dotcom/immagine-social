name: Processar artes Immagine gratis
on:
  push:
    paths:
      - '.github/trigger-artes.txt'
  workflow_dispatch:
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar renderizador gratuito
        run: npm install sharp@0.33.5
      - name: Gerar cinco artes sem API paga
        env:
          SUPABASE_URL: https://vmitpfyqnlsrrrbvgjeo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gerar-artes-gratis.mjs
