name: Processar artes Immagine gratis
on:
  push:
    paths:
      - '.github/trigger-artes.txt'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: immagine-artes
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar fila no Supabase
        id: fila
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STATUS=$(curl -fsS 'https://vmitpfyqnlsrrrbvgjeo.supabase.co/rest/v1/post_change_requests?select=id,status&status=in.(pendente,em_andamento)&order=created_at.desc&limit=1' -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "fila=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "[]" ]; then echo "processar=false" >> "$GITHUB_OUTPUT"; else echo "processar=true" >> "$GITHUB_OUTPUT"; fi
      - name: Renderizar gratuitamente
        if: steps.fila.outputs.processar == 'true'
        run: |
          npm install --no-save sharp@0.33.5
          node scripts/render-week.mjs
      - name: Salvar artes
        if: steps.fila.outputs.processar == 'true'
        run: |
          git config user.name "immagine-bot"
          git config user.email "immagine-bot@users.noreply.github.com"
          git add public/assets/semana-2026-10-05-final
          git diff --cached --quiet || (git commit -m "Gera artes automaticamente da fila" && git push)
      - name: Enviar para aprovação no app
        if: steps.fila.outputs.processar == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          BASE='/assets/semana-2026-10-05-final/'
          for P in '2026-10-05:01.webp' '2026-10-06:02.webp' '2026-10-07:03.webp' '2026-10-08:04.webp' '2026-10-09:05.webp'; do
            ID="${P%%:*}"; IMG="${P##*:}"
            curl -fsS -X PATCH "https://vmitpfyqnlsrrrbvgjeo.supabase.co/rest/v1/posts?id=eq.$ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' --data "{\"status\":\"para_aprovacao\",\"ready\":false,\"image_url\":\"$BASE$IMG?v=${GITHUB_RUN_ID}\"}"
          done
          curl -fsS -X PATCH 'https://vmitpfyqnlsrrrbvgjeo.supabase.co/rest/v1/weeks?id=eq.2026-10-05' -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data '{"status":"para_aprovacao"}'
          curl -fsS -X PATCH 'https://vmitpfyqnlsrrrbvgjeo.supabase.co/rest/v1/post_change_requests?id=eq.a9fff107-275e-40ed-8acf-aede54d269e9' -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data '{"status":"concluido","resolution":"5 artes refeitas com cenas novas por serviço, matriz usada apenas como referência visual; enviadas para aprovação."}'
